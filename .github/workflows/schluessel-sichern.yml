# Einmalig: Signatur-Schlüssel mit dem Secret KEYSTORE_SCHLUESSEL verschlüsseln (imperum.keystore → imperum.keystore.enc).
# Danach liegt im Repo nur noch die verschlüsselte Datei; der Build entschlüsselt sie mit demselben Secret.
name: Signatur-Schlüssel sichern

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sichern:
    runs-on: ubuntu-latest
    env:
      K: ${{ secrets.KEYSTORE_SCHLUESSEL }}
    steps:
      - uses: actions/checkout@v4
      - name: Verschlüsseln und prüfen
        run: |
          if [ -z "$K" ]; then echo "::error::Secret KEYSTORE_SCHLUESSEL fehlt (Settings → Secrets and variables → Actions)"; exit 1; fi
          if [ ${#K} -lt 16 ]; then echo "::error::KEYSTORE_SCHLUESSEL ist zu kurz – bitte mindestens 16 Zeichen"; exit 1; fi
          test -f imperum.keystore
          openssl enc -aes-256-cbc -pbkdf2 -iter 200000 -salt -in imperum.keystore -out imperum.keystore.enc -pass env:K
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -in imperum.keystore.enc -out /tmp/check.keystore -pass env:K
          cmp imperum.keystore /tmp/check.keystore && echo "Verschlüsselt und geprüft."
      - name: Verschlüsselte Datei speichern
        run: |
          git config user.name "github-actions"; git config user.email "github-actions@users.noreply.github.com"
          git add imperum.keystore.enc
          git commit -m "Signatur-Schlüssel verschlüsselt (imperum.keystore.enc) [skip ci]"
          git push
