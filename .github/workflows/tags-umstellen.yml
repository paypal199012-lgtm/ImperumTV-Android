# Einmalig: Versions-Tags auf die bereinigte Git-Geschichte umstellen (ohne offenen Signatur-Schlüssel)
name: Tags umstellen

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  tags:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Tags umstellen
        run: |
          refs=""
          while read t sha; do
            git cat-file -e "$sha^{commit}" || { echo "fehlt: $t $sha"; continue; }
            refs="$refs +$sha:refs/tags/$t"
          done < tag-umstellung.txt
          git push origin $refs
          echo "Fertig: $(wc -l < tag-umstellung.txt) Tags"
