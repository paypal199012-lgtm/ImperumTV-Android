# Kommt nach .github/workflows/build-apk.yml
name: Android APK bauen

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      # Signatur-Schlüssel: liegt verschlüsselt im Repo, entschlüsselt mit dem Secret KEYSTORE_SCHLUESSEL
      - name: Signatur-Schlüssel entschlüsseln
        env:
          K: ${{ secrets.KEYSTORE_SCHLUESSEL }}
        run: |
          if [ -f imperum.keystore.enc ]; then
            if [ -z "$K" ]; then echo "::error::Secret KEYSTORE_SCHLUESSEL fehlt"; exit 1; fi
            openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -in imperum.keystore.enc -out imperum.keystore -pass env:K
          fi
          test -f imperum.keystore
          # Sicherheitsprüfung: immer exakt derselbe Schlüssel (sonst ließen sich Updates nicht installieren)
          echo "6bda81a81ff6255b447af3c062eb452bd5d37de4a4f688b229ad0c92ddcdfa14  imperum.keystore" | sha256sum -c -

      - name: Projekt zusammenbauen
        run: sh setup-android.sh

      - name: APK bauen
        id: full
        continue-on-error: true
        working-directory: build-project
        run: gradle assembleRelease --no-daemon --stacktrace

      # Erster Versuch fehlgeschlagen (oft nur ein kurzer Netzwerkfehler): noch einmal MIT OpenVPN versuchen
      - name: APK bauen (2. Versuch mit OpenVPN)
        id: retry
        if: steps.full.outcome == 'failure'
        continue-on-error: true
        run: |
          sleep 20
          rm -rf build-project
          sh setup-android.sh
          cd build-project && gradle assembleRelease --no-daemon --stacktrace

      # Klappt auch das nicht, wird die App ohne OpenVPN gebaut (Updates kommen trotzdem)
      - name: APK ohne OpenVPN bauen (nur falls beide Versuche fehlschlagen)
        if: steps.full.outcome == 'failure' && steps.retry.outcome == 'failure'
        run: |
          echo "::warning::OpenVPN ließ sich nicht mitbauen – APK wird ohne OpenVPN gebaut"
          OPENVPN=0 sh setup-android.sh
          cd build-project && gradle assembleRelease --no-daemon --stacktrace

      - name: APK umbenennen
        run: cp build-project/app/build/outputs/apk/release/app-release.apk ImperumTV.apk

      - uses: actions/upload-artifact@v4
        with:
          name: ImperumTV-apk
          path: ImperumTV.apk

      - name: Als Download veröffentlichen
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: ImperumTV 1.0.${{ github.run_number }}
          files: ImperumTV.apk
          make_latest: true
